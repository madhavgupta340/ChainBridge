<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainBridge</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
 <div class="top-inner">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span class="name">ChainBridge</span></div>
  <div class="badges" id="badges" aria-live="polite"></div>
 </div>
</header>
<div class="page">
 <section id="status" class="status-strip" aria-label="Where your data is"></section>
 <nav aria-label="Steps"><ol id="stepper" class="stepper"></ol></nav>
 <main id="view" tabindex="-1"></main>
 <section id="activity" class="activity" aria-label="Activity log"></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
